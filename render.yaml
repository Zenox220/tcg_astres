services:
  - type: web
    name: astrea-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: astrea-database
          property: connectionString

databases:
  - name: astrea-database
    plan: basic-256mb
    databaseName: astrea
    user: astrea
